name: Bot Auto Restart 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# 🔑 PERMISSIONS WAJIB: agar GITHUB_TOKEN bisa trigger workflow lain
permissions:
  actions: write
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl \
            wget \
            git \
            unzip \
            unrar-free \
            p7zip-full \
            screen \
            jq \
            nano
          
          echo "Dependencies installed"
      
      # ==========================================================
      #  🐘 INSTALL PHP (BARU)
      # ==========================================================
      - name: Install PHP
        run: |
          echo "=========================================="
          echo "🐘 INSTALLING PHP"
          echo "=========================================="
          
          sudo apt-get install -y -qq \
            php-cli \
            php-cgi \
            php-curl \
            php-mbstring \
            php-xml \
            php-json \
            php-zip \
            php-gd \
            php-sqlite3
          
          echo ""
          echo "✅ PHP installed:"
          php -v
          echo ""
          echo "✅ PHP-CGI location:"
          which php-cgi || echo "php-cgi tidak ada, pakai php CLI"
          echo ""
          echo "✅ PHP extensions:"
          php -m
      
      - name: Install Cloudflared with Token
        run: |
          echo "Installing Cloudflared..."
          
          wget -q -O cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          
          cloudflared --version
          
          echo "Starting Cloudflared tunnel..."
          nohup cloudflared tunnel run --token eyJhIjoiY2FkNjFhM2UyYzk5Y2NiN2IwNTQ2MmU0MWY1N2JjNTYiLCJ0IjoiMzRlYzljNzEtYWNmZC00MzA1LTlkNjEtMzMxZGFiMGRiNTBiIiwicyI6Ik5XSXhaVFJqTlRZdFpXVm1PQzAwTnpZNExXRTBORGt0TVdFNU5UQTFPREprWVdNeSJ9 > /tmp/cloudflared.log 2>&1 &
          
          sleep 3
          if pgrep -f "cloudflared" > /dev/null; then
            echo "✅ Cloudflared tunnel running"
          else
            echo "⚠️ Cloudflared gagal start, cek log:"
            cat /tmp/cloudflared.log
          fi
      
      - name: Unzip and Setup Bot Files
        run: |
          echo "=========================================="
          echo "EXTRACTING ZIP FILES"
          echo "=========================================="
          
          echo "Files before extraction:"
          ls -la
          echo ""
          
          # Extract .zip
          shopt -s nullglob
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "📦 Extracting: $zipfile"
              unzip -o "$zipfile"
              if [ $? -eq 0 ]; then
                echo "✅ Successfully extracted: $zipfile"
                rm -f "$zipfile"
                echo "🗑️ Removed: $zipfile"
              else
                echo "❌ Failed to extract: $zipfile"
              fi
              echo ""
            fi
          done
          
          # Extract .rar (pakai unrar-free, fallback ke 7z)
          for rarfile in *.rar; do
            if [ -f "$rarfile" ]; then
              echo "📦 Extracting: $rarfile"
              if command -v unrar > /dev/null 2>&1; then
                unrar x -o+ "$rarfile"
              elif command -v 7z > /dev/null 2>&1; then
                7z x "$rarfile" -y
              else
                echo "⚠️ Tidak ada unrar/7z, skip"
                continue
              fi
              if [ $? -eq 0 ]; then
                echo "✅ Successfully extracted: $rarfile"
                rm -f "$rarfile"
              else
                echo "❌ Failed to extract: $rarfile"
              fi
              echo ""
            fi
          done
          
          # Extract .7z
          for sevenzfile in *.7z; do
            if [ -f "$sevenzfile" ]; then
              echo "📦 Extracting: $sevenzfile"
              7z x "$sevenzfile" -y
              if [ $? -eq 0 ]; then
                echo "✅ Successfully extracted: $sevenzfile"
                rm -f "$sevenzfile"
              else
                echo "❌ Failed to extract: $sevenzfile"
              fi
              echo ""
            fi
          done
          shopt -u nullglob
          
          echo "=========================================="
          echo "FILES AFTER EXTRACTION:"
          echo "=========================================="
          ls -la
          echo ""
          
          echo "Checking for package.json files..."
          find . -name "package.json" -type f
          echo ""
          
          echo "Checking for composer.json files..."
          find . -name "composer.json" -type f
          echo ""
      
      - name: Setup Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'
      
      - name: Install Node Dependencies
        run: |
          echo "=========================================="
          echo "INSTALLING NODE DEPENDENCIES"
          echo "=========================================="
          
          if [ -f "package.json" ]; then
            echo "📦 Found package.json in root, installing..."
            npm install --no-audit --no-fund --silent
            echo "✅ Root dependencies installed"
          fi
          
          shopt -s nullglob
          for dir in */; do
            if [ -f "${dir}package.json" ]; then
              echo "📦 Installing in: $dir"
              cd "$dir"
              npm install --no-audit --no-fund --silent
              cd ..
              echo "✅ Dependencies installed in $dir"
            fi
          done
          shopt -u nullglob
          
          echo ""
          echo "✅ All dependencies installed"
      
      # ==========================================================
      #  🎼 INSTALL COMPOSER DEPENDENCIES (BARU)
      # ==========================================================
      - name: Install PHP Composer Dependencies
        run: |
          echo "=========================================="
          echo "🎼 INSTALLING PHP COMPOSER DEPENDENCIES"
          echo "=========================================="
          
          if [ -f "composer.json" ]; then
            echo "📦 Found composer.json in root, installing..."
            
            # Install composer kalau belum ada
            if ! command -v composer > /dev/null 2>&1; then
              echo "📥 Installing Composer..."
              curl -sS https://getcomposer.org/installer | php
              sudo mv composer.phar /usr/local/bin/composer
              sudo chmod +x /usr/local/bin/composer
            fi
            
            composer install --no-interaction --no-progress --no-dev 2>&1 | tail -20
            echo "✅ Root composer dependencies installed"
          fi
          
          shopt -s nullglob
          for dir in */; do
            if [ -f "${dir}composer.json" ]; then
              echo "📦 Installing composer in: $dir"
              cd "$dir"
              
              if ! command -v composer > /dev/null 2>&1; then
                curl -sS https://getcomposer.org/installer | php
                sudo mv composer.phar /usr/local/bin/composer
                sudo chmod +x /usr/local/bin/composer
              fi
              
              composer install --no-interaction --no-progress --no-dev 2>&1 | tail -20
              cd ..
              echo "✅ Composer deps installed in $dir"
            fi
          done
          shopt -u nullglob
          
          echo ""
          echo "✅ All composer dependencies installed"
      
      - name: Start Bot with Auto Restart
        env:
          # 🔑 PENTING: pakai PAT (Personal Access Token) agar bisa trigger workflow
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 🐘 PHP binary hint
          PHP_BIN: php-cgi
        run: |
          echo "=========================================="
          echo "STARTING BOT WITH AUTO RESTART"
          echo "=========================================="
          echo "✅ Auto restart on crash (langsung jalan lagi)"
          echo "✅ Trigger new workflow setiap 6 jam (24/7)"
          echo "✅ PHP available: $(php -v | head -1)"
          echo "=========================================="
          
          if [ -n "$GH_PAT" ]; then
            TRIGGER_TOKEN="$GH_PAT"
            echo "🔑 Menggunakan PAT untuk trigger workflow"
          else
            TRIGGER_TOKEN="$GITHUB_TOKEN"
            echo "⚠️  PAT tidak ada, pakai GITHUB_TOKEN (mungkin gagal trigger workflow)"
          fi
          
          echo "export TRIGGER_TOKEN='$TRIGGER_TOKEN'" > /tmp/token.env
          echo "export REPO='$GITHUB_REPOSITORY'" >> /tmp/token.env
          echo "export PHP_BIN='php-cgi'" >> /tmp/token.env
          
          cat > start_bot.sh << 'EOF'
          #!/bin/bash
          
          source /tmp/token.env
          
          echo "Starting bot with auto restart on crash..."
          echo "PHP binary: $PHP_BIN"
          
          find_main_file() {
            if [ -f "index.js" ]; then echo "index.js"; return 0; fi
            if [ -f "app.js" ]; then echo "app.js"; return 0; fi
            if [ -f "main.js" ]; then echo "main.js"; return 0; fi
            if [ -f "server.js" ]; then echo "server.js"; return 0; fi
            if [ -f "bot.js" ]; then echo "bot.js"; return 0; fi
            
            shopt -s nullglob
            for dir in */; do
              if [ -f "${dir}index.js" ]; then echo "${dir}index.js"; return 0; fi
              if [ -f "${dir}app.js" ]; then echo "${dir}app.js"; return 0; fi
              if [ -f "${dir}main.js" ]; then echo "${dir}main.js"; return 0; fi
              if [ -f "${dir}server.js" ]; then echo "${dir}server.js"; return 0; fi
              if [ -f "${dir}bot.js" ]; then echo "${dir}bot.js"; return 0; fi
            done
            shopt -u nullglob
            
            echo ""
            return 1
          }
          
          run_bot() {
            MAIN_FILE=$(find_main_file)
            
            if [ -z "$MAIN_FILE" ]; then
              echo "ERROR: No main file found!"
              echo "Files in current directory:"
              ls -la
              echo ""
              echo "Files in subdirectories:"
              ls -la */
              sleep 30
              return 1
            fi
            
            echo "Starting bot: $MAIN_FILE"
            echo "Started at: $(date)"
            echo "-----------------------------------"
            
            # 🐘 Ensure PHP bisa ditemukan dari Node.js
            export PHP_BIN=php-cgi
            export PATH="/usr/bin:/usr/local/bin:$PATH"
            
            node "$MAIN_FILE"
            
            EXIT_CODE=$?
            echo "-----------------------------------"
            echo "❌ Bot stopped with code: $EXIT_CODE"
            echo "🔄 Restarting in 3 seconds..."
            sleep 3
            return $EXIT_CODE
          }
          
          trigger_new_workflow() {
            echo ""
            echo "=========================================="
            echo "🔄 TRIGGERING NEW WORKFLOW (24/7)"
            echo "=========================================="
            echo "Time: $(date)"
            
            HTTP_CODE=$(curl -s -o /tmp/trigger_resp.json -w "%{http_code}" -X POST \
              -H "Authorization: token $TRIGGER_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/bot.yml/dispatches" \
              -d '{"ref":"main"}')
            
            if [ "$HTTP_CODE" = "204" ]; then
              echo "✅ New workflow triggered! (HTTP $HTTP_CODE)"
            else
              echo "⚠️ Trigger response: HTTP $HTTP_CODE"
              cat /tmp/trigger_resp.json 2>/dev/null
            fi
            echo "=========================================="
          }
          
          RESTART_COUNT=0
          START_TIME=$(date +%s)
          MAX_RUNTIME=$((5 * 3600 + 59 * 60))
          
          while true; do
            RESTART_COUNT=$((RESTART_COUNT + 1))
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((MAX_RUNTIME - ELAPSED))
            
            if [ $REMAINING -lt 60 ]; then
              echo ""
              echo "=========================================="
              echo "⚠️ 1 MINUTE REMAINING!"
              echo "Triggering new workflow..."
              echo "=========================================="
              
              trigger_new_workflow
              
              echo "Waiting 30 seconds before exit..."
              sleep 30
              echo "Exiting..."
              exit 0
            fi
            
            echo ""
            echo "=========================================="
            echo "🚀 BOT RESTART #$RESTART_COUNT"
            echo "⏱️ Runtime: $((ELAPSED / 3600))h $(((ELAPSED % 3600) / 60))m $((ELAPSED % 60))s"
            echo "⏳ Remaining: $((REMAINING / 3600))h $(((REMAINING % 3600) / 60))m $((REMAINING % 60))s"
            echo "📅 Time: $(date)"
            echo "=========================================="
            
            run_bot
            
            echo "Restarting bot after crash..."
            sleep 2
          done
          EOF
          
          chmod +x start_bot.sh
          
          screen -dmS bot bash start_bot.sh
          
          echo ""
          echo "✅ Bot is running with auto restart"
          echo "📊 Screen session: bot"
          echo "📋 To monitor: screen -r bot"
          echo "=========================================="
          
          cat > monitor.sh << 'MONITOR'
          #!/bin/bash
          
          source /tmp/token.env
          
          echo "Monitoring bot..."
          echo "PHP binary: $PHP_BIN"
          
          while true; do
            sleep 60
            
            if ! screen -list | grep -q "bot"; then
              echo "⚠️ Screen died! Restarting..."
              screen -dmS bot bash start_bot.sh
              echo "✅ Screen restarted"
            fi
            
            if ! pgrep -f "node" > /dev/null; then
              echo "⚠️ Node process not found! Restarting..."
              screen -S bot -X quit 2>/dev/null || true
              screen -dmS bot bash start_bot.sh
              echo "✅ Bot restarted"
            fi
            
            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "⚠️ Cloudflared died! Restarting..."
              nohup cloudflared tunnel run --token eyJhIjoiY2FkNjFhM2UyYzk5Y2NiN2IwNTQ2MmU0MWY1N2JjNTYiLCJ0IjoiMzRlYzljNzEtYWNmZC00MzA1LTlkNjEtMzMxZGFiMGRiNTBiIiwicyI6Ik5XSXhaVFJqTlRZdFpXVm1PQzAwTnpZNExXRTBORGt0TVdFNU5UQTFPREprWVdNeSJ9 > /tmp/cloudflared.log 2>&1 &
            fi
            
            if [ $((SECONDS % 300)) -eq 0 ]; then
              echo "[$(date)] ✅ Bot is running..."
              echo "   PHP: $(php -v 2>/dev/null | head -1 || echo 'not found')"
              screen -ls
            fi
          done
          MONITOR
          
          chmod +x monitor.sh
          screen -dmS monitor bash monitor.sh
          
          echo "✅ Monitor running"
          echo ""
          
          START_TIME=$(date +%s)
          MAX_RUNTIME=$((5 * 3600 + 59 * 60))
          
          while true; do
            sleep 300
            
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((MAX_RUNTIME - ELAPSED))
            
            echo "[$(date)] Workflow running"
            echo "Runtime: $((ELAPSED / 3600))h $(((ELAPSED % 3600) / 60))m $((ELAPSED % 60))s"
            echo "Remaining: $((REMAINING / 3600))h $(((REMAINING % 3600) / 60))m $((REMAINING % 60))s"
            
            if [ $REMAINING -lt 120 ] && [ $REMAINING -gt 60 ]; then
              echo "🔄 Triggering new workflow (2 minutes remaining)..."
              HTTP_CODE=$(curl -s -o /tmp/trigger_resp.json -w "%{http_code}" -X POST \
                -H "Authorization: token $TRIGGER_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$REPO/actions/workflows/bot.yml/dispatches" \
                -d '{"ref":"main"}')
              if [ "$HTTP_CODE" = "204" ]; then
                echo "✅ New workflow triggered!"
              else
                echo "⚠️ Trigger failed: HTTP $HTTP_CODE"
                cat /tmp/trigger_resp.json 2>/dev/null
              fi
            fi
            
            if ! screen -list | grep -q "bot"; then
              echo "⚠️ Bot screen died! Restarting..."
              screen -dmS bot bash start_bot.sh
            fi
            
            if ! screen -list | grep -q "monitor"; then
              echo "⚠️ Monitor died! Restarting..."
              screen -dmS monitor bash monitor.sh
            fi
            
            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "⚠️ Cloudflared died! Restarting..."
              nohup cloudflared tunnel run --token eyJhIjoiY2FkNjFhM2UyYzk5Y2NiN2IwNTQ2MmU0MWY1N2JjNTYiLCJ0IjoiMzRlYzljNzEtYWNmZC00MzA1LTlkNjEtMzMxZGFiMGRiNTBiIiwicyI6Ik5XSXhaVFJqTlRZdFpXVm1PQzAwTnpZNExXRTBORGt0TVdFNU5UQTFPREprWVdNeSJ9 > /tmp/cloudflared.log 2>&1 &
            fi
            
            echo "Bot status:"
            echo "   PHP: $(php -v 2>/dev/null | head -1 || echo 'not found')"
            screen -ls
            echo ""
          done
