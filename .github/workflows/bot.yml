name: Bot Auto Restart 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 359

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          echo "=========================================="
          echo "📦 INSTALLING SYSTEM DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl \
            wget \
            git \
            unzip \
            unrar-free \
            p7zip-full \
            screen \
            jq \
            nano \
            tree \
            openssl

          echo "✅ Dependencies installed"

      # ==========================================================
      #  🐘 INSTALL PHP
      # ==========================================================
      - name: Install PHP
        run: |
          echo "=========================================="
          echo "🐘 INSTALLING PHP"
          echo "=========================================="

          sudo apt-get install -y -qq \
            php-cli \
            php-cgi \
            php-curl \
            php-mbstring \
            php-xml \
            php-json \
            php-zip \
            php-gd \
            php-sqlite3

          echo ""
          echo "✅ PHP installed:"
          php -v
          echo ""
          echo "✅ PHP-CGI location:"
          which php-cgi || echo "php-cgi tidak ada, pakai php CLI"
          echo ""
          echo "✅ PHP extensions:"
          php -m

      # ==========================================================
      #  ☁️ INSTALL CLOUDFLARED
      # ==========================================================
      - name: Install Cloudflared with Token
        run: |
          echo "=========================================="
          echo "☁️ INSTALLING CLOUDFLARED"
          echo "=========================================="

          wget -q -O cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

          cloudflared --version

          echo "Starting Cloudflared tunnel..."
          nohup cloudflared tunnel run --token eyJhIjoiY2FkNjFhM2UyYzk5Y2NiN2IwNTQ2MmU0MWY1N2JjNTYiLCJ0IjoiMzRlYzljNzEtYWNmZC00MzA1LTlkNjEtMzMxZGFiMGRiNTBiIiwicyI6Ik5XSXhaVFJqTlRZdFpXVm1PQzAwTnpZNExXRTBORGt0TVdFNU5UQTFPREprWVdNeSJ9 > /tmp/cloudflared.log 2>&1 &

          sleep 3
          if pgrep -f "cloudflared" > /dev/null; then
            echo "✅ Cloudflared tunnel running"
          else
            echo "⚠️ Cloudflared gagal start, cek log:"
            cat /tmp/cloudflared.log
          fi

      # ==========================================================
      #  📦 EXTRACT BOT FILES
      # ==========================================================
      - name: Unzip and Setup Bot Files
        run: |
          echo "=========================================="
          echo "📦 EXTRACTING ARCHIVE FILES"
          echo "=========================================="

          echo "Files before extraction:"
          ls -la
          echo ""

          shopt -s nullglob
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "📦 Extracting: $zipfile"
              unzip -o "$zipfile"
              if [ $? -eq 0 ]; then
                echo "✅ Successfully extracted: $zipfile"
                rm -f "$zipfile"
              else
                echo "❌ Failed to extract: $zipfile"
              fi
              echo ""
            fi
          done

          for rarfile in *.rar; do
            if [ -f "$rarfile" ]; then
              echo "📦 Extracting: $rarfile"
              if command -v unrar > /dev/null 2>&1; then
                unrar x -o+ "$rarfile"
              elif command -v 7z > /dev/null 2>&1; then
                7z x "$rarfile" -y
              else
                echo "⚠️ Tidak ada unrar/7z, skip"
                continue
              fi
              if [ $? -eq 0 ]; then
                echo "✅ Successfully extracted: $rarfile"
                rm -f "$rarfile"
              fi
              echo ""
            fi
          done

          for sevenzfile in *.7z; do
            if [ -f "$sevenzfile" ]; then
              echo "📦 Extracting: $sevenzfile"
              7z x "$sevenzfile" -y
              if [ $? -eq 0 ]; then
                echo "✅ Successfully extracted: $sevenzfile"
                rm -f "$sevenzfile"
              fi
              echo ""
            fi
          done
          shopt -u nullglob

          echo "=========================================="
          echo "📁 FILES AFTER EXTRACTION:"
          echo "=========================================="
          ls -la
          echo ""

          echo "🌳 Directory tree (depth 3, tanpa node_modules):"
          tree -L 3 -I 'node_modules|.git|vendor' || ls -R
          echo ""

          echo "📄 Found package.json files:"
          find . -name "package.json" -type f -not -path "*/node_modules/*"
          echo ""

          echo "📄 Found composer.json files:"
          find . -name "composer.json" -type f -not -path "*/vendor/*"
          echo ""

          echo "📄 Found .js files (entry point candidates):"
          find . -name "*.js" -type f -not -path "*/node_modules/*" -not -path "*/vendor/*" | head -50
          echo ""

      # ==========================================================
      #  🟢 INSTALL NODE.JS
      # ==========================================================
      - name: Setup Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Install Node Dependencies
        run: |
          echo "=========================================="
          echo "🟢 INSTALLING NODE DEPENDENCIES"
          echo "=========================================="

          if [ -f "package.json" ]; then
            echo "📦 Found package.json in root, installing..."
            npm install --no-audit --no-fund 2>&1 | tail -30
            echo "✅ Root dependencies installed"
          fi

          shopt -s nullglob
          for dir in */; do
            if [ -f "${dir}package.json" ]; then
              echo ""
              echo "📦 Installing in: $dir"
              cd "$dir"
              npm install --no-audit --no-fund 2>&1 | tail -30
              cd ..
              echo "✅ Dependencies installed in $dir"
            fi
          done
          shopt -u nullglob

          echo ""
          echo "✅ All node dependencies installed"

      # ==========================================================
      #  🎼 INSTALL COMPOSER
      # ==========================================================
      - name: Install PHP Composer Dependencies
        run: |
          echo "=========================================="
          echo "🎼 INSTALLING COMPOSER DEPENDENCIES"
          echo "=========================================="

          if [ -f "composer.json" ]; then
            echo "📦 Found composer.json in root, installing..."

            if ! command -v composer > /dev/null 2>&1; then
              echo "📥 Installing Composer..."
              curl -sS https://getcomposer.org/installer | php
              sudo mv composer.phar /usr/local/bin/composer
              sudo chmod +x /usr/local/bin/composer
            fi

            composer install --no-interaction --no-progress --no-dev 2>&1 | tail -20
            echo "✅ Root composer dependencies installed"
          fi

          shopt -s nullglob
          for dir in */; do
            if [ -f "${dir}composer.json" ]; then
              echo "📦 Installing composer in: $dir"
              cd "$dir"

              if ! command -v composer > /dev/null 2>&1; then
                curl -sS https://getcomposer.org/installer | php
                sudo mv composer.phar /usr/local/bin/composer
                sudo chmod +x /usr/local/bin/composer
              fi

              composer install --no-interaction --no-progress --no-dev 2>&1 | tail -20
              cd ..
              echo "✅ Composer deps installed in $dir"
            fi
          done
          shopt -u nullglob

          echo ""
          echo "✅ All composer dependencies installed"

      # ==========================================================
      #  🎵 AUTO-INSTALL AUDIOVAULT (SEBELUM START BOT)
      # ==========================================================
      - name: Install Audiovault
        run: |
          echo "=========================================="
          echo "🎵 INSTALLING AUDIOVAULT (Spotify → MP3)"
          echo "=========================================="

          if ! command -v docker > /dev/null 2>&1; then
            echo "❌ Docker tidak ada di runner"
            exit 1
          fi

          echo "✅ Docker version:"
          docker --version
          echo "✅ Docker Compose version:"
          docker compose version
          echo ""

          AV_DIR="Audiovault"

          if [ -d "$AV_DIR" ]; then
            echo "⚠️  Folder Audiovault sudah ada, skip clone"
          else
            echo "📥 Cloning Audiovault..."
            git clone --depth 1 https://github.com/Bl4nk44/Audiovault.git "$AV_DIR"
          fi

          cd "$AV_DIR"

          if [ ! -f ".env" ]; then
            echo "🔧 Setup .env..."
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
            PASS=$(openssl rand -hex 16)
            if grep -q "^ADMIN_PASSWORD=" .env; then
              sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=${PASS}/" .env
            else
              echo "ADMIN_PASSWORD=${PASS}" >> .env
            fi
            echo "🔑 Audiovault ADMIN_PASSWORD: ${PASS}"
          fi

          echo ""
          echo "🐳 Pull images..."
          docker compose pull 2>&1 | tail -5 || true

          echo ""
          echo "🐳 Build & start (butuh 2-3 menit)..."
          docker compose up -d --build 2>&1 | tail -20

          echo ""
          echo "⏳ Tunggu container siap..."
          sleep 15

          echo ""
          echo "📊 Container status:"
          docker compose ps

          echo ""
          echo "🔍 Cek health:"
          for i in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "✅ Audiovault API UP"
              break
            fi
            echo "⏳ Attempt $i: belum siap, tunggu 5s..."
            sleep 5
          done

          echo ""
          echo "📋 Container logs (tail 20):"
          docker compose logs --tail 20

          cd - > /dev/null

          echo ""
          echo "✅ Audiovault installed & started"
          echo "   Web UI : http://127.0.0.1:2137"
          echo "   API    : http://127.0.0.1:8000/docs"

      # ==========================================================
      #  🚀 RUN ALL BOTS WITH CONSOLE LOG
      # ==========================================================
      - name: Start All Bots with Auto Restart
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHP_BIN: php-cgi
          AUDIOVAULT_API: http://127.0.0.1:8000
        run: |
          echo "=========================================="
          echo "🚀 STARTING ALL BOTS"
          echo "=========================================="
          echo "✅ Auto restart on crash"
          echo "✅ Multi-bot support (semua bot dijalankan)"
          echo "✅ Console log real-time"
          echo "✅ Trigger new workflow tiap 6 jam (24/7)"
          echo "✅ PHP: $(php -v | head -1)"
          echo "=========================================="

          if [ -n "$GH_PAT" ]; then
            TRIGGER_TOKEN="$GH_PAT"
            echo "🔑 Menggunakan PAT untuk trigger workflow"
          else
            TRIGGER_TOKEN="$GITHUB_TOKEN"
            echo "⚠️  PAT tidak ada, pakai GITHUB_TOKEN"
          fi

          echo "export TRIGGER_TOKEN='$TRIGGER_TOKEN'" > /tmp/token.env
          echo "export REPO='$GITHUB_REPOSITORY'" >> /tmp/token.env
          echo "export PHP_BIN='php-cgi'" >> /tmp/token.env
          echo "export AUDIOVAULT_API='http://127.0.0.1:8000'" >> /tmp/token.env
          echo "export PATH='/usr/bin:/usr/local/bin:\$PATH'" >> /tmp/token.env

          # ==================================================
          #  SCRIPT: START ALL BOTS
          # ==================================================
          cat > start_bot.sh << 'BOTEOF'
          #!/bin/bash

          source /tmp/token.env

          echo "Starting ALL bots with auto restart on crash..."
          echo "PHP binary: $PHP_BIN"
          echo "Audiovault: $AUDIOVAULT_API"
          echo ""

          declare -a BOT_FILES=()

          find_all_bots() {
            BOT_FILES=()

            shopt -s nullglob
            for f in *.js; do
              [ -f "$f" ] || continue
              case "$f" in
                start_bot.js|monitor.js|setup.js|config.js|webpack.config.js|.*) continue ;;
              esac
              LINES=$(wc -l < "$f" 2>/dev/null || echo 0)
              if [ "$LINES" -gt 5 ]; then
                BOT_FILES+=("$f")
              fi
            done

            for dir in */; do
              [ -d "$dir" ] || continue
              case "$dir" in
                node_modules/|.git/|vendor/|.github/|Audiovault/) continue ;;
              esac

              if [ -f "${dir}package.json" ]; then
                MAIN=$(jq -r '.main // empty' "${dir}package.json" 2>/dev/null)
                if [ -n "$MAIN" ] && [ -f "${dir}${MAIN}" ]; then
                  BOT_FILES+=("${dir}${MAIN}")
                  continue
                fi
                for candidate in index.js app.js main.js server.js bot.js; do
                  if [ -f "${dir}${candidate}" ]; then
                    BOT_FILES+=("${dir}${candidate}")
                    break
                  fi
                done
              else
                for candidate in index.js app.js main.js server.js bot.js; do
                  if [ -f "${dir}${candidate}" ]; then
                    BOT_FILES+=("${dir}${candidate}")
                    break
                  fi
                done
              fi
            done
            shopt -u nullglob

            echo "=========================================="
            echo "📋 Found ${#BOT_FILES[@]} bot(s):"
            echo "=========================================="
            for bot in "${BOT_FILES[@]}"; do
              echo "  ✔️  $bot"
            done
            echo "=========================================="
            echo ""
          }

          # ==================================================
          #  🎵 START / RESTART AUDIOVAULT
          # ==================================================
          start_audiovault() {
            local AV_DIR="Audiovault"

            if ! command -v docker > /dev/null 2>&1; then
              echo "⚠️  Docker tidak ada, skip Audiovault"
              return 0
            fi

            if [ ! -d "$AV_DIR" ]; then
              echo "⚠️  Folder Audiovault tidak ada, skip"
              return 0
            fi

            cd "$AV_DIR" || return 1

            # Cek apakah container sudah jalan
            if docker compose ps 2>/dev/null | grep -q "Up"; then
              echo "✅ Audiovault sudah running"
              cd - > /dev/null
              return 0
            fi

            echo "🔄 Start Audiovault..."
            docker compose up -d 2>&1 | tail -10
            cd - > /dev/null
          }

          run_single_bot() {
            local MAIN_FILE="$1"
            local BOT_DIR=$(dirname "$MAIN_FILE")
            local BOT_FILE=$(basename "$MAIN_FILE")
            local BOT_NAME="${BOT_FILE%.js}"

            echo "🚀 [$(date '+%H:%M:%S')] Starting: $MAIN_FILE (from $BOT_DIR)"

            cd "$BOT_DIR"
            node "$BOT_FILE" 2>&1 | stdbuf -oL -eL sed -u "s/^/[$BOT_NAME] /"
            local EXIT_CODE=${PIPESTATUS[0]}
            cd - > /dev/null

            echo "❌ [$(date '+%H:%M:%S')] $MAIN_FILE stopped (exit: $EXIT_CODE)"
            return $EXIT_CODE
          }

          run_bot_forever() {
            local MAIN_FILE="$1"
            local BOT_NAME=$(basename "$MAIN_FILE" .js)

            while true; do
              run_single_bot "$MAIN_FILE"
              echo "🔄 [$BOT_NAME] Restarting in 3s..."
              sleep 3
            done
          }

          run_all_bots() {
            find_all_bots

            if [ ${#BOT_FILES[@]} -eq 0 ]; then
              echo "❌ No bot files found!"
              echo "Files di root:"
              ls -la
              return 1
            fi

            local PIDS=()
            for MAIN_FILE in "${BOT_FILES[@]}"; do
              run_bot_forever "$MAIN_FILE" &
              PIDS+=($!)
              echo "✅ [$(date '+%H:%M:%S')] Bot '${MAIN_FILE}' started (PID: $!)"
            done

            echo ""
            echo "🎯 Total ${#PIDS[@]} bot(s) running in parallel"
            echo "=========================================="
            echo ""

            for pid in "${PIDS[@]}"; do
              wait "$pid"
            done
          }

          # Re-scan dan restart semua kalau ada yang mati
          while true; do
            start_audiovault
            run_all_bots
            echo "⚠️ All bots exited. Re-scanning in 10s..."
            sleep 10
          done
          BOTEOF

          chmod +x start_bot.sh

          # ==================================================
          #  SCRIPT: MONITOR
          # ==================================================
          cat > monitor.sh << 'MONITOREOF'
          #!/bin/bash

          source /tmp/token.env

          echo "=========================================="
          echo "👁️  MONITOR STARTED"
          echo "=========================================="

          while true; do
            sleep 60

            if ! screen -list | grep -q "bot"; then
              echo "⚠️ [$(date)] Bot screen died! Restarting..."
              screen -dmS bot bash start_bot.sh
              echo "✅ Bot restarted"
            fi

            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "⚠️ [$(date)] Cloudflared died! Restarting..."
              nohup cloudflared tunnel run --token eyJhIjoiY2FkNjFhM2UyYzk5Y2NiN2IwNTQ2MmU0MWY1N2JjNTYiLCJ0IjoiMzRlYzljNzEtYWNmZC00MzA1LTlkNjEtMzMxZGFiMGRiNTBiIiwicyI6Ik5XSXhaVFJqTlRZdFpXVm1PQzAwTnpZNExXRTBORGt0TVdFNU5UQTFPREprWVdNeSJ9 > /tmp/cloudflared.log 2>&1 &
            fi

            # Cek Audiovault
            if command -v docker > /dev/null 2>&1 && [ -d "Audiovault" ]; then
              if ! (cd Audiovault && docker compose ps 2>/dev/null | grep -q "Up"); then
                echo "⚠️ [$(date)] Audiovault died! Restarting..."
                (cd Audiovault && docker compose up -d 2>&1 | tail -5)
              fi
            fi

            echo "[$(date)] ✅ Monitor check"
            echo "   PHP: $(php -v 2>/dev/null | head -1 || echo 'not found')"
            echo "   Node processes: $(pgrep -f node | wc -l)"
            echo "   Audiovault: $(cd Audiovault 2>/dev/null && docker compose ps 2>/dev/null | grep -c 'Up' || echo 0) container(s) up"
            screen -ls || true
          done
          MONITOREOF

          chmod +x monitor.sh

          # ==================================================
          #  START SCREEN SESSIONS
          # ==================================================
          echo "🖥️  Starting screen sessions..."

          screen -dmS bot bash start_bot.sh
          screen -dmS monitor bash monitor.sh

          sleep 5

          echo ""
          echo "=========================================="
          echo "✅ BOT + MONITOR RUNNING"
          echo "=========================================="
          screen -ls
          echo ""

          # ==================================================
          #  MAIN LOOP
          # ==================================================
          START_TIME=$(date +%s)
          MAX_RUNTIME=$((5 * 3600 + 50 * 60))
          LAST_TRIGGER=0

          echo "📊 Main loop started — log akan tampil di sini"
          echo "=========================================="

          while true; do
            sleep 20

            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((MAX_RUNTIME - ELAPSED))

            echo ""
            echo "════════════════════════════════════════════"
            echo "⏱️  [$(date '+%Y-%m-%d %H:%M:%S')]"
            echo "   Runtime   : $((ELAPSED / 3600))h $(((ELAPSED % 3600) / 60))m $((ELAPSED % 60))s"
            echo "   Remaining : $((REMAINING / 3600))h $(((REMAINING % 3600) / 60))m $((REMAINING % 60))s"
            echo "════════════════════════════════════════════"

            if screen -list | grep -q "bot"; then
              echo "📺 Bot screen is ALIVE"
              screen -S bot -X hardcopy /tmp/bot_screen.log 2>/dev/null
              if [ -f /tmp/bot_screen.log ]; then
                echo "───── 📜 BOT CONSOLE (last 40 lines) ─────"
                tail -40 /tmp/bot_screen.log
                echo "──────────────────────────────────────────"
              fi
            else
              echo "❌ Bot screen is DEAD — restarting..."
              screen -dmS bot bash start_bot.sh
            fi

            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "⚠️ Cloudflared died! Restarting..."
              nohup cloudflared tunnel run --token eyJhIjoiY2FkNjFhM2UyYzk5Y2NiN2IwNTQ2MmU0MWY1N2JjNTYiLCJ0IjoiMzRlYzljNzEtYWNmZC00MzA1LTlkNjEtMzMxZGFiMGRiNTBiIiwicyI6Ik5XSXhaVFJqTlRZdFpXVm1PQzAwTnpZNExXRTBORGt0TVdFNU5UQTFPREprWVdNeSJ9 > /tmp/cloudflared.log 2>&1 &
            fi

            # Cek Audiovault
            if command -v docker > /dev/null 2>&1 && [ -d "Audiovault" ]; then
              if ! (cd Audiovault && docker compose ps 2>/dev/null | grep -q "Up"); then
                echo "⚠️ Audiovault died! Restarting..."
                (cd Audiovault && docker compose up -d 2>&1 | tail -5)
              fi
            fi

            if [ $REMAINING -lt 300 ] && [ $LAST_TRIGGER -eq 0 ]; then
              echo ""
              echo "🔄 Triggering new workflow (5 min remaining)..."
              HTTP_CODE=$(curl -s -o /tmp/trigger_resp.json -w "%{http_code}" -X POST \
                -H "Authorization: token $TRIGGER_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$REPO/actions/workflows/bot.yml/dispatches" \
                -d '{"ref":"main"}')

              if [ "$HTTP_CODE" = "204" ]; then
                echo "✅ New workflow triggered!"
                LAST_TRIGGER=1
              else
                echo "⚠️ Trigger failed: HTTP $HTTP_CODE"
                cat /tmp/trigger_resp.json 2>/dev/null
              fi
            fi

            if [ $REMAINING -lt 60 ]; then
              echo ""
              echo "⏰ Time's up! Final console dump..."
              screen -S bot -X hardcopy /tmp/bot_final.log 2>/dev/null
              tail -100 /tmp/bot_final.log 2>/dev/null
              echo "👋 Exiting workflow..."
              exit 0
            fi
          done
