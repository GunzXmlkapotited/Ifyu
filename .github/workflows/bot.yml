name: Bot Auto Restart 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl \
            wget \
            git \
            unzip \
            screen \
            jq \
            nano
          
          echo "Dependencies installed"
      
      - name: Install Cloudflared with Token
        run: |
          echo "Installing Cloudflared..."
          
          wget -q -O cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          
          cloudflared --version
          
          echo "Starting Cloudflared tunnel..."
          cloudflared tunnel run --token eyJhIjoiY2FkNjFhM2UyYzk5Y2NiN2IwNTQ2MmU0MWY1N2JjNTYiLCJ0IjoiMzRlYzljNzEtYWNmZC00MzA1LTlkNjEtMzMxZGFiMGRiNTBiIiwicyI6Ik5XSXhaVFJqTlRZdFpXVm1PQzAwTnpZNExXRTBORGt0TVdFNU5UQTFPREprWVdNeSJ9 &
          
          echo "Cloudflared tunnel running"
      
      - name: Unzip Files
        run: |
          echo "Extracting zip files..."
          
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              unzip -o "$zipfile"
              rm -f "$zipfile"
              echo "Extracted: $zipfile"
            fi
          done
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Node Dependencies
        run: |
          echo "Installing Node dependencies..."
          
          for dir in */; do
            if [ -f "${dir}package.json" ]; then
              echo "Installing in: $dir"
              cd "$dir"
              npm install --no-audit --no-fund --silent || true
              cd ..
            fi
          done
          
          echo "Node dependencies installed"
      
      - name: Start Bot with Auto Restart & Auto Trigger
        run: |
          echo "=========================================="
          echo "BOT AUTO RESTART 24/7"
          echo "=========================================="
          echo "Action lifetime: 5 jam 59 menit"
          echo "Auto trigger new workflow: 1 menit sebelum mati"
          echo "=========================================="
          
          cat > super_restart.sh << 'EOF'
          #!/bin/bash
          
          echo "SUPER AUTO RESTART BOT 24/7"
          echo "=================================="
          
          find_main_file() {
            for possible in "index.js" "app.js" "main.js" "server.js" "bot.js" "run.js" "start.js"; do
              if [ -f "$possible" ]; then
                echo "$possible"
                return 0
              fi
            done
            
            for dir in */; do
              for possible in "index.js" "app.js" "main.js" "server.js" "bot.js"; do
                if [ -f "${dir}${possible}" ]; then
                  echo "${dir}${possible}"
                  return 0
                fi
              done
            done
            
            echo ""
            return 1
          }
          
          start_bot() {
            MAIN_FILE=$(find_main_file)
            
            if [ -z "$MAIN_FILE" ]; then
              echo "ERROR: No main file found!"
              ls -la
              sleep 30
              return 1
            fi
            
            echo "Main file: $MAIN_FILE"
            echo "Started at: $(date)"
            echo "-----------------------------------"
            
            node "$MAIN_FILE"
            
            EXIT_CODE=$?
            echo "-----------------------------------"
            echo "Bot exited with code: $EXIT_CODE"
            echo "Restarting in 3 seconds..."
            sleep 3
            return $EXIT_CODE
          }
          
          trigger_new_workflow() {
            echo ""
            echo "=========================================="
            echo "TRIGGERING NEW WORKFLOW"
            echo "=========================================="
            echo "Current time: $(date)"
            echo "Using GITHUB_TOKEN to trigger..."
            
            curl -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/bot.yml/dispatches \
              -d '{"ref":"main"}' \
              -w "\nHTTP Status: %{http_code}\n"
            
            echo "New workflow triggered!"
            echo "New action will start soon..."
            echo "=========================================="
          }
          
          RESTART_COUNT=0
          START_TIME=$(date +%s)
          MAX_RUNTIME=$((5 * 3600 + 59 * 60))
          
          while true; do
            RESTART_COUNT=$((RESTART_COUNT + 1))
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((MAX_RUNTIME - ELAPSED))
            
            if [ $REMAINING -lt 60 ]; then
              echo ""
              echo "=========================================="
              echo "1 MENIT TERSISA!"
              echo "Triggering new workflow..."
              echo "=========================================="
              
              trigger_new_workflow
              
              echo ""
              echo "Menunggu 30 detik sebelum exit..."
              sleep 30
              
              echo "Exiting gracefully..."
              exit 0
            fi
            
            echo ""
            echo "=========================================="
            echo "RESTART #$RESTART_COUNT"
            echo "Runtime: $((ELAPSED / 3600))h $(((ELAPSED % 3600) / 60))m $((ELAPSED % 60))s"
            echo "Remaining: $((REMAINING / 3600))h $(((REMAINING % 3600) / 60))m $((REMAINING % 60))s"
            echo "Time: $(date)"
            echo "=========================================="
            
            start_bot
            
            echo "Restarting bot..."
            sleep 2
          done
          EOF
          
          chmod +x super_restart.sh
          
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          
          screen -dmS bot bash super_restart.sh
          
          echo ""
          echo "Bot running with SUPER AUTO RESTART"
          echo "Screen session: bot"
          echo "Monitor: screen -r bot"
          echo "=========================================="
          
          cat > monitor.sh << 'MONITOR'
          #!/bin/bash
          
          echo "Monitoring bot & auto trigger..."
          
          while true; do
            sleep 60
            
            if ! screen -list | grep -q "bot"; then
              echo "Screen died! Restarting..."
              screen -dmS bot bash super_restart.sh
              echo "Screen restarted"
            fi
            
            if ! pgrep -f "node.*index.js\|node.*app.js\|node.*main.js\|node.*bot.js" > /dev/null; then
              echo "Node process not found! Restarting screen..."
              screen -S bot -X quit 2>/dev/null || true
              screen -dmS bot bash super_restart.sh
              echo "Bot process restarted"
            fi
            
            if [ $((SECONDS % 300)) -eq 0 ]; then
              echo "[$(date)] Bot is running..."
              screen -ls
            fi
          done
          MONITOR
          
          chmod +x monitor.sh
          screen -dmS monitor bash monitor.sh
          
          echo "Monitor running"
          echo ""
          
          START_TIME=$(date +%s)
          MAX_RUNTIME=$((5 * 3600 + 59 * 60))
          
          while true; do
            sleep 300
            
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((MAX_RUNTIME - ELAPSED))
            
            echo "[$(date)] Workflow running"
            echo "Runtime: $((ELAPSED / 3600))h $(((ELAPSED % 3600) / 60))m $((ELAPSED % 60))s"
            echo "Remaining: $((REMAINING / 3600))h $(((REMAINING % 3600) / 60))m $((REMAINING % 60))s"
            
            if [ $REMAINING -lt 120 ] && [ $REMAINING -gt 60 ]; then
              echo "Triggering new workflow (2 menit tersisa)..."
              curl -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches \
                -d '{"ref":"main"}'
              echo "New workflow triggered!"
            fi
            
            if ! screen -list | grep -q "bot"; then
              echo "Bot screen died! Restarting..."
              screen -dmS bot bash super_restart.sh
            fi
            
            if ! screen -list | grep -q "monitor"; then
              echo "Monitor died! Restarting..."
              screen -dmS monitor bash monitor.sh
            fi
            
            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "Cloudflared died! Restarting..."
              cloudflared tunnel run --token eyJhIjoiY2FkNjFhM2UyYzk5Y2NiN2IwNTQ2MmU0MWY1N2JjNTYiLCJ0IjoiMzRlYzljNzEtYWNmZC00MzA1LTlkNjEtMzMxZGFiMGRiNTBiIiwicyI6Ik5XSXhaVFJqTlRZdFpXVm1PQzAwTnpZNExXRTBORGt0TVdFNU5UQTFPREprWVdNeSJ9 &
            fi
            
            echo "Bot status:"
            screen -ls
            echo ""
          done
